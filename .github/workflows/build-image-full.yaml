# Build the full GitHub-hosted-compatible actions-runner-processor image
# (heavy: ~1h, 50GB+). Dispatch-only so it never runs on PRs/pushes. Expand the
# artifact to runner.image_path (default /opt/runner-btrfs/image).
name: build-image-full

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Ubuntu release for the full image (22.04 or 24.04)'
        required: false
        default: '24.04'
        type: choice
        options:
          - '22.04'
          - '24.04'

permissions:
  contents: write

jobs:
  build-full:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install systemd-container, debootstrap and shellcheck
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq systemd-container debootstrap shellcheck

      - name: Lint image shell scripts
        run: shellcheck image/build-image.sh image/build-image-full.sh

      - name: Free disk space for the full image build
        run: |
          # The full builder reaches tens of GB (toolchains + apt). GitHub-hosted
          # ubuntu-24.04 runners ship with heavy preinstalled toolchains, so
          # clear the ones this build doesn't need to avoid ENOSPC mid-build.
          sudo rm -rf /opt/hostedtoolcache /usr/share/dotnet \
            /usr/local/lib/android /opt/ghc
          df -h / | tail -1

      - name: Build full rootfs
        run: |
          # Override the release manifest value via the dispatch input.
          sudo sed -i "s/^release:.*/release: \"${{ inputs.release }}\"/" image/image-full.yaml
          # Build in the repo (build-image-full.sh binds the repo into the
          # container so the runner-images checkout is available).
          sudo bash image/build-image-full.sh /tmp/runner-image-full

      - name: Restore runner ownership of the image output
        run: |
          # build-image-full.sh runs under sudo, so the output dir and tarball
          # end up root-owned. The split/publish steps run as the runner user,
          # so hand ownership back before splitting.
          sudo chown -R "$(id -u):$(id -g)" /tmp/runner-image-full
          ls -la /tmp/runner-image-full

      - name: Split full image into <2GB release parts
        run: |
          # The full image tarball exceeds GitHub's 2GB-per-asset cap, so split
          # it into <2GB numeric parts (actions-runner-image-full-<arch>.tar.gz.part-000,
          # .part-001, ...). image install-full re-concatenates them.
          for tarball in /tmp/runner-image-full/actions-runner-image-full-*.tar.gz; do
            echo ">>> splitting $tarball"
            cd /tmp/runner-image-full
            split -C 1900M -d -a 3 "$(basename "$tarball")" "$(basename "$tarball").part-"
            rm -f "$(basename "$tarball")"
            ls -la "$(basename "$tarball").part-"*
          done

      - name: Publish split parts to the latest release
        run: |
          # Upload the split parts to the newest release (created by tagpr),
          # replacing any previous parts. gh is preinstalled on hosted runners.
          TAG="$(gh release list --limit 1 --json tagName --jq '.[0].tagName')"
          echo ">>> latest release: $TAG"
          cd /tmp/runner-image-full
          gh release upload "$TAG" actions-runner-image-full-*.tar.gz.part-* --clobber
          echo ">>> published split parts to $TAG"