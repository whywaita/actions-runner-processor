# Build the actions-runner-processor custom runner image (nspawn rootfs).
#
# Two image types are produced, both as a rootfs .tar.gz that you expand to
# runner.image_path (default /opt/runner-btrfs/image):
#
#   build        — lightweight rootfs (debootstrap + a few apt packages),
#                  fast, runs on pull_request / push / workflow_dispatch.
#   build-full   — full GitHub-hosted-compatible toolset (Packer + LXD,
#                  mirroring actions-runner-images-lxd). Heavy (~1h, 50GB+),
#                  so it runs only on workflow_dispatch via the "Type" input.
#
# The ubuntu-latest runner is root, so debootstrap/chroot work directly.
name: build-image

on:
  workflow_dispatch:
    inputs:
      type:
        description: 'Image type to build'
        required: true
        default: 'lightweight'
        type: choice
        options:
          - lightweight
          - full
      release:
        description: 'Ubuntu release for the full image (22.04 or 24.04)'
        required: false
        default: '24.04'
        type: choice
        options:
          - '22.04'
          - '24.04'
  push:
    paths:
      - 'image/**'
      - '.github/workflows/build-image.yaml'
  pull_request:
    paths:
      - 'image/**'
      - '.github/workflows/build-image.yaml'

permissions:
  contents: read

jobs:
  build:
    # Runs for PRs/pushes/lightweight dispatch. Full builds are handled by the
    # build-full job below, so the lightweight job only runs once.
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.type == 'full') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install debootstrap and shellcheck
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq debootstrap shellcheck

      - name: Lint image shell scripts
        run: shellcheck image/build-image.sh

      - name: Build rootfs
        run: |
          # GitHub runner runs as root; OUTPUT_DIR under /tmp is fine.
          sudo bash image/build-image.sh /tmp/runner-image

      - name: Smoke-test that the runner binary is present
        run: |
          IMG="/tmp/runner-image/actions-runner-image-$(awk '/^arch:/{gsub(/"/,"",$2); print $2}' image/image.yaml).tar.gz"
          tar tzf "$IMG" \
            | grep -q 'opt/actions-runner/run.sh' \
            && echo "runner run.sh present" \
            || { echo "run.sh missing in image"; exit 1; }

      - name: Upload rootfs image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: actions-runner-image
          path: /tmp/runner-image/actions-runner-image-*.tar.gz
          if-no-files-found: error

  build-full:
    # Only triggered explicitly via workflow_dispatch (full). Heavy build.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.type == 'full' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install systemd-container, debootstrap and shellcheck
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq systemd-container debootstrap shellcheck

      - name: Lint image shell scripts
        run: shellcheck image/build-image.sh image/build-image-full.sh

      - name: Build full rootfs
        run: |
          # Override the release manifest value via the dispatch input.
          sudo sed -i "s/^release:.*/release: \"${{ inputs.release }}\"/" image/image-full.yaml
          # Build in the repo (build-image-full.sh binds the repo into the
          # container so the runner-images checkout is available).
          sudo bash image/build-image-full.sh /tmp/runner-image-full

      - name: Upload full rootfs image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: actions-runner-image-full
          path: /tmp/runner-image-full/actions-runner-image-full-*.tar.gz
          if-no-files-found: error
