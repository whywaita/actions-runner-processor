name: build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
      - name: Install bubblewrap
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
      - name: Verify bwrap sandbox
        run: |
          bwrap --version
          # Check if unprivileged user namespaces work
          if bwrap --ro-bind / / --dev /dev --proc /proc -- /usr/bin/true 2>/dev/null; then
            echo "bwrap sandbox OK (unprivileged)"
          else
            echo "unprivileged bwrap requires sudo on GitHub Actions, testing with sudo..."
            sudo bwrap --ro-bind / / --dev /dev --proc /proc -- /usr/bin/true
            echo "bwrap sandbox OK (sudo)"
          fi
      - name: Verify temporary overlay
        run: |
          bwrap \
            --unshare-all \
            --share-net \
            --overlay-src /usr \
            --tmp-overlay /usr \
            --dev /dev \
            --proc /proc \
            --uid 0 \
            --gid 0 \
            /usr/bin/sh -c 'touch /usr/.overlay-test && test -f /usr/.overlay-test'
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./... -v -race
      - name: Vet
        run: go vet ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12
          install-mode: go-install
          args: --timeout=5m
