name: build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27"
      - name: Install systemd-container and debootstrap
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq systemd-container debootstrap
      - name: Verify systemd-nspawn boots a runner image with ephemeral overlay
        run: |
          systemd-nspawn --version | head -1
          # Boot a minimal debootstrap rootfs (without the heavy runner rb) with
          # an ephemeral overlay, run a command inside, and confirm the write is
          # isolated to the overlay (not persisted to the lower image dir).
          set -e
          sudo rm -rf /tmp/nspawn-rootfs /tmp/nspawn-upper
          sudo mkdir -p /tmp/nspawn-rootfs
          sudo debootstrap --variant=minbase --arch=amd64 noble /tmp/nspawn-rootfs http://archive.ubuntu.com/ubuntu/ \
            >/dev/null 2>&1
          sudo systemd-nspawn \
            --directory=/tmp/nspawn-rootfs \
            --volatile=overlay \
            --as-pid2 \
            --machine=ci-nspawn \
            -- /bin/sh -c 'echo qemu-x86_64-static > /tmp/overlay-write-test && test -f /tmp/overlay-write-test && echo "ephemeral overlay write OK"'
          # The write must NOT be visible on the host lower dir.
          if [ -f /tmp/nspawn-rootfs/tmp/overlay-write-test ]; then
            echo "FAIL: overlay write leaked to host lower dir"
            exit 1
          fi
          echo "ephemeral overlay isolation OK"
          sudo rm -rf /tmp/nspawn-rootfs /tmp/nspawn-upper
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./... -v -race
      - name: Vet
        run: go vet ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27"
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
          install-mode: go-install
          args: --timeout=5m
