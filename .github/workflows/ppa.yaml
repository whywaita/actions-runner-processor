name: ppa

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "debian/**"
      - "deploy/**"
      - ".github/workflows/ppa.yaml"
      - "go.mod"
      - "go.sum"

permissions:
  contents: read

env:
  # Hardcoded: Launchpad account / PPA identity.
  LAUNCHPAD_USER: whywaita
  LAUNCHPAD_PPA: actions-runner-processor
  # Must be an email registered on the Launchpad account (matches the GPG key
  # uid). Override via repository variable LAUNCHPAD_EMAIL.
  LAUNCHPAD_EMAIL: ${{ vars.LAUNCHPAD_EMAIL || 'whywaita@example.com' }}

# ============================================================================
# Publish to Launchpad PPA ppa:whywaita/actions-runner-processor.
#
# One-time Launchpad setup (web UI, account must exist first):
#   1. Create PPA "actions-runner-processor" and enable BOTH series:
#      noble (24.04) + resolute (26.04).
#   2. Edit PPA -> Dependencies -> add ppa:longsleep/golang-backports
#      (build-time only; provides golang-1.26-go >= 1.26.5, which neither
#      Ubuntu series ships natively and go.mod requires).
#   3. Register the signing OpenPGP key (no passphrase, for headless CI) and
#      an SSH key (used by dput sftp) on the Launchpad account.
#
# Repository settings:
#   secrets:   LAUNCHPAD_GPG_PRIVATE_KEY (armored, no passphrase)
#              LAUNCHPAD_SSH_PRIVATE_KEY (ed25519)
#   variables: LAUNCHPAD_EMAIL (optional; the Launchpad account email, must
#              match the GPG key uid). LAUNCHPAD_USER / LAUNCHPAD_PPA are
#              hardcoded above (whywaita / actions-runner-processor).
#
# Trigger: stable tags only (vX.Y.Z, no -rc/-beta). Launchpad uploads are
# per-series source builds with series-suffixed versions because a source
# version must be unique inside the PPA:
#   noble    -> <tag>~ppa1~ubuntu24.04.1   (Distribution: noble)
#   resolute -> <tag>~ppa1~ubuntu26.04.1   (Distribution: resolute)
# ============================================================================

jobs:
  # PR-only: prove the .deb builds the same way Launchpad buildd would
  # (noble + golang-1.26-go from the longsleep PPA, offline via vendor/).
  package-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Vendor Go modules (buildd hosts are offline)
        run: go mod vendor

      - name: Install deb build tools (mirrors PPA build deps)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq software-properties-common
          sudo add-apt-repository -y ppa:longsleep/golang-backports >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential golang-1.26-go debhelper devscripts fakeroot

      - name: Rewrite changelog for validation build
        run: |
          cat > debian/changelog <<EOF
          actions-runner-processor (0.0.0+ci) noble; urgency=medium

            * CI packaging validation (never published).

           -- whywaita <${{ env.LAUNCHPAD_EMAIL }}>  $(date -R)
          EOF

      - name: Build binary package
        run: |
          set -o pipefail
          dpkg-buildpackage -b -us -uc -rfakeroot 2>&1 | tail -40
          echo "== built deb =="
          ls -la ../actions-runner-processor_*.deb
          dpkg-deb --info ../actions-runner-processor_*.deb | head -25
          echo "== contents =="
          dpkg-deb --contents ../actions-runner-processor_*.deb

  # Stable tag push: build one source package per series and upload both.
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - codename: noble
            series_ver: "24.04"
          - codename: resolute
            series_ver: "26.04"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Install packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq debhelper devscripts dpkg-dev dput gnupg

      - name: Vendor Go modules (buildd hosts are offline)
        run: go mod vendor

      - name: Import Launchpad signing key
        env:
          LAUNCHPAD_GPG_PRIVATE_KEY: ${{ secrets.LAUNCHPAD_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$LAUNCHPAD_GPG_PRIVATE_KEY" ]; then
            echo "::error::missing secret LAUNCHPAD_GPG_PRIVATE_KEY" >&2
            exit 1
          fi
          printf '%s\n' "$LAUNCHPAD_GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format=long

      - name: Configure sftp upload key for dput
        env:
          LAUNCHPAD_SSH_PRIVATE_KEY: ${{ secrets.LAUNCHPAD_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$LAUNCHPAD_SSH_PRIVATE_KEY" ]; then
            echo "::error::missing secret LAUNCHPAD_SSH_PRIVATE_KEY" >&2
            exit 1
          fi
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$LAUNCHPAD_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan ppa.launchpad.net >> "$HOME/.ssh/known_hosts" 2>/dev/null
          cat > "$HOME/.dput.cf" <<EOF
          [ppa-$LAUNCHPAD_USER-$LAUNCHPAD_PPA]
          fqdn = ppa.launchpad.net
          method = sftp
          login = $LAUNCHPAD_USER
          incoming = ~$LAUNCHPAD_USER/ubuntu/$LAUNCHPAD_PPA/
          allow_unsigned_uploads = 0
          EOF

      - name: Build source package and upload
        env:
          DEBFULLNAME: whywaita
          DEBEMAIL: ${{ env.LAUNCHPAD_EMAIL }}
          CODENAME: ${{ matrix.codename }}
          SERIES_VER: ${{ matrix.series_ver }}
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME#v}"
          PPA_VER="${TAG}~ppa1~ubuntu${SERIES_VER}.1"

          cat > debian/changelog <<EOF
          actions-runner-processor (${PPA_VER}) ${CODENAME}; urgency=medium

            * Release ${TAG} for Ubuntu ${CODENAME} (Launchpad PPA).

           -- ${DEBFULLNAME} <${DEBEMAIL}>  $(date -R)
          EOF

          # Safety net: if a build artifact ever appears at the repo root the
          # native source tarball (whole tree) must not ship it.
          rm -f ./actions-runner-processor

          # ~ppa1 is reset per release tag; bump to ~ppa2 manually in the
          # matrix version if the same tag must ever be re-uploaded.
          dpkg-buildpackage -S -d -k"$(gpg --list-secret-keys --with-colons | awk -F: '$1 == "sec" {print $5; exit}')"
          dput "ppa-$LAUNCHPAD_USER-$LAUNCHPAD_PPA" "../actions-runner-processor_${PPA_VER}_source.changes"
          echo "PPA build page: https://launchpad.net/~$LAUNCHPAD_USER/+archive/ubuntu/$LAUNCHPAD_PPA/+builds?batch=75"
