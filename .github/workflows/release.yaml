name: release
on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write
  pull-requests: write
  issues: read
  actions: write

jobs:
  tagpr:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
    outputs:
      tag: ${{ steps.tagpr.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - id: tagpr
        uses: Songmu/tagpr@v1.20.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  goreleaser:
    needs: tagpr
    if: always() && (startsWith(github.ref, 'refs/tags/') || needs.tagpr.outputs.tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
      actions: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27"
      - name: Build lightweight runner image for the release
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq debootstrap
          # Build the rootfs OUTSIDE the repo (under $RUNNER_TEMP): build-image.sh
          # emits a root-owned rootfs whose deep dirs (e.g. etc/ssl/private) are
          # unreadable, and GoReleaser's archive globs walk the repo tree and fail
          # on them. Only the tarball is copied into ./.release/ for extra_files.
          sudo mkdir -p "$RUNNER_TEMP"/runner-image
          sudo bash image/build-image.sh "$RUNNER_TEMP"/runner-image
          sudo mkdir -p ./.release/runner-image
          sudo cp "$RUNNER_TEMP"/runner-image/actions-runner-image-*.tar.gz ./.release/runner-image/
          ls -la ./.release/runner-image/
      - uses: goreleaser/goreleaser-action@v7.2.3
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Attach SLSA build provenance attestations to every release artifact:
      # Go binaries/archives, debs, checksums.txt (goreleaser's dist/) and the
      # lightweight runner image tarball (extra_files, kept under ./.release/).
      # Signed with a Sigstore short-lived cert bound to this workflow run;
      # recorded in the repo attestation store. Verify with:
      #   gh attestation verify <file> -R whywaita/actions-runner-processor
      - name: Attest build provenance
        uses: actions/attest@v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/checksums.txt
            ./.release/runner-image/*.tar.gz

      # Dispatch the heavy full-image build (~1h) AFTER goreleaser has created
      # the Release, so the split parts publish to the just-created Release
      # (build-image-full resolves its upload target at upload time via
      # `gh release list --limit 1`). A dispatch (workflow_dispatch) is used
      # instead of a `uses:` reusable-workflow call: the reusable-call phase
      # evaluation combined with `if:` + `needs:` was observed to SKIP the
      # build-full-image job on tag-push runs (2026-09-01, v0.0.7-rc1), silently
      # shipping releases without a fresh full image.
      #
      # The normal release path is a push to main, where tagpr creates the tag
      # and the Release itself, so gating only on `startsWith(github.ref,
      # 'refs/tags/')` never fired: a tag created with GITHUB_TOKEN does not
      # trigger a workflow run, which is why no run exists for v0.0.8 or v0.0.9
      # and both releases shipped without a full image (their parts only appeared
      # later through manual dispatches). Fire on the tagpr output as well — it is
      # exactly the "a release was just cut" signal, the same one goreleaser is
      # gated on above — and build the image from the tag, so the published image
      # is attributable to the release.
      - name: Dispatch full image build
        if: startsWith(github.ref, 'refs/tags/') || needs.tagpr.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAGPR_TAG: ${{ needs.tagpr.outputs.tag }}
        run: |
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            ref="$TAGPR_TAG"
          else
            ref="$GITHUB_REF_NAME"
          fi
          gh workflow run build-image-full.yaml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$ref" \
            -f release=24.04
          echo "dispatched build-image-full at ref=$ref"
