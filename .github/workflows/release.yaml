name: release
on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write
  pull-requests: write
  issues: read
  actions: write

jobs:
  tagpr:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
    outputs:
      tag: ${{ steps.tagpr.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tagpr
        uses: Songmu/tagpr@242e22916eb775d6e359959fe3ba5c497de4a01a # v1.20.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  goreleaser:
    needs: tagpr
    if: always() && (startsWith(github.ref, 'refs/tags/') || needs.tagpr.outputs.tag != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
      - name: Build lightweight runner image for the release
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq debootstrap
          # Build the rootfs OUTSIDE the repo (under $RUNNER_TEMP): build-image.sh
          # emits a root-owned rootfs whose deep dirs (e.g. etc/ssl/private) are
          # unreadable, and GoReleaser's archive globs walk the repo tree and fail
          # on them. Only the tarball is copied into ./.release/ for extra_files.
          sudo mkdir -p "$RUNNER_TEMP"/runner-image
          sudo bash image/build-image.sh "$RUNNER_TEMP"/runner-image
          sudo mkdir -p ./.release/runner-image
          sudo cp "$RUNNER_TEMP"/runner-image/actions-runner-image-*.tar.gz ./.release/runner-image/
          ls -la ./.release/runner-image/
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Dispatch the heavy full-image build (~1h) AFTER goreleaser has created
      # the Release, so the split parts publish to the just-created Release
      # (build-image-full resolves its upload target at upload time via
      # `gh release list --limit 1`). A dispatch (workflow_dispatch) is used
      # instead of a `uses:` reusable-workflow call: the reusable-call phase
      # evaluation combined with `if:` + `needs:` was observed to SKIP the
      # build-full-image job on tag-push runs (2026-09-01, v0.0.7-rc1), silently
      # shipping releases without a fresh full image. The dispatch step is gated
      # on the tag ref so it fires exactly once per release (not on the tagpr
      # main-push run, where github.ref is refs/heads/main).
      - name: Dispatch full image build
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build-image-full.yaml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f release=24.04
          echo "dispatched build-image-full at ref=$GITHUB_REF_NAME"
