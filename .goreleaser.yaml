version: 2

builds:
  - env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    main: ./cmd/actions-runner-processor/

archives:
  - formats: [tar.gz]
    name_template: "actions-runner-processor_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc

nfpms:
  - package_name: actions-runner-processor
    file_name_template: "actions-runner-processor_{{ .Version }}_{{ .Arch }}"
    vendor: "whywaita"
    homepage: "https://github.com/whywaita/actions-runner-processor"
    maintainer: "whywaita <whywaita@example.com>"
    description: |
      A lightweight Go binary to run GitHub Actions self-hosted runners without Kubernetes.
      Runs on a single Linux VM, detects jobs via the Message Session API, and dynamically
      starts/destroys ephemeral runners isolated by systemd-nspawn.
    license: MIT
    formats:
      - deb
    section: admin
    priority: optional
    dependencies:
      - systemd-container
    contents:
      - src: ./deploy/config.example.yaml
        dst: /etc/actions-runner-processor/config.yaml
        type: config|noreplace
      - src: ./deploy/actions-runner-processor.service
        dst: /etc/systemd/system/actions-runner-processor.service
        type: config
    scripts:
      postinstall: ./deploy/postinstall.sh
      preremove: ./deploy/preremove.sh
