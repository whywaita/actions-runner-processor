# actions-runner-processor configuration
# See DESIGN.md for full documentation

github:
  client_id: ""                    # GitHub App ID
  private_key_path: ""             # Path to GitHub App private key (.pem)

scale_set_name: "actions-runner-processor"

runner:
  mode: "nspawn"                   # sandbox backend: "nspawn" (default) or "bwrap" (deprecated)
  version: "latest"                # actions/runner version (used by bwrap mode)
  actions_runner_path: "/opt/runner/actions-runner"   # bwrap mode only
  workspace_root: "/opt/runner/workspaces"            # bwrap mode only
  # nspawn mode: custom runner image (root filesystem directory). Booted
  # read-only with an ephemeral overlayed root; changes are discarded on exit.
  image_path: "/opt/runner/image"
  # nspawn mode: absolute path (inside the container) of the boot command.
  entrypoint: "/opt/actions-runner/run.sh"
  max_runners: 0                   # 0 = NumCPU
  min_runners: 0

metrics:
  enabled: true
  addr: ":9090"

webui:
  enabled: true
  addr: ":8080"