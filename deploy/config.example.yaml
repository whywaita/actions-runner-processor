# actions-runner-processor configuration
# See DESIGN.md for full documentation

github:
  client_id: ""                    # GitHub App ID
  private_key_path: ""             # Path to GitHub App private key (.pem)

scale_set_name: "actions-runner-processor"

runner:
  version: "latest"                # actions/runner version (informational)
  # How long to keep running on SIGTERM/SIGINT so in-flight jobs can finish
  # before force-killing remaining runner containers. systemd TimeoutStopSec
  # (in the packaged unit, default 660s) must be >= this value.
  shutdown_grace_timeout: "10m"    # default 10m
  # Custom runner image (root filesystem directory). Booted via --ephemeral:
  # the image must be a btrfs subvolume so systemd-nspawn can CoW-snapshot it
  # and discard the writable copy on exit (ext4 falls back to a full copy per
  # job). The bundled host runs it from /opt/runner-btrfs/image.
  image_path: "/opt/runner/image"
  # Host directory for the per-runner job workspace, bind-mounted into the
  # container at _work so job artifacts are visible on the host and cleaned up
  # after exit. Everything else already lives on the real-disk CoW snapshot, so
  # no cache bind is needed to avoid ENOSPC.
  workspace_path: "/opt/runner/workspaces"
  # Absolute path (inside the container) of the boot command.
  entrypoint: "/opt/actions-runner/run.sh"
  max_runners: 0                   # 0 = NumCPU
  min_runners: 0

metrics:
  enabled: true
  addr: ":9090"

webui:
  enabled: true
  addr: ":8080"