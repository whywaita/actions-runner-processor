# Custom runner image manifest for actions-runner-processor (nspawn mode).
#
# This manifest drives image/build-image.sh, which builds a lightweight root
# filesystem (rootfs) that systemd-nspawn boots as runner.image_path (default
# /opt/runner/image).
#
# WHAT THIS IMAGE IS / CONTAINS
#   - A minimal Debian/Ubuntu base (debootstrap --variant=minbase, so no
#     systemd as PID1; the container is booted with --as-pid2 in an ephemeral
#     overlay).
#   - The official actions/runner binary at /opt/actions-runner (the container
#     entrypoint /opt/actions-runner/run.sh boots a JIT-configured listener).
#   - Any apt packages you declare below (build tools, runtime deps), baked in
#     so jobs don't install them per run.
#   - A dedicated `runner` user (uid 1001, home /home/runner, passwordless
#     sudo) mirroring the GitHub-hosted layout. launchNspawn boots the
#     container with --user=runner, so the runner process and job steps run as
#     this user and `sudo` works inside jobs.
#
# On the host, the rootfs tarball is expanded to runner.image_path and booted
# read-only with an ephemeral overlay; per-job writes are discarded on exit.

# Base distribution for debootstrap. Must be a Debian/Ubuntu release
# (e.g. "ubuntu:noble" for Ubuntu 24.04 or "debian:trixie").
distribution: "ubuntu"

# Release codename used by debootstrap ("noble" = Ubuntu 24.04, "jammy" = 22.04).
release: "noble"

# Architecture for the rootfs ("amd64" or "arm64").
arch: "amd64"

# Version of actions/runner to install at /opt/actions-runner.
# "latest" resolves the newest release at build time.
runner_version: "latest"

# Absolute path inside the container of the runner boot command.
entrypoint: "/opt/actions-runner/run.sh"

# Extra apt packages to install inside the rootfs (in addition to the runner
# runtime dependencies sqlite3, curl, git, jq). Add your build tools here
# rather than installing them per job.
packages:
  - build-essential
  - curl
  - git
  - jq
  - openssh-client
  - python3
  - sqlite3
  - sudo
  - unzip
  - wget
  # whois provides mkpasswd, used to bake the runner user's password hash.
  - whois
  # actions/runner is .NET-based. These are its documented runtime deps; the
  # listener aborts at startup if ICU / system identity / TLS pieces are missing.
  - libicu
  - netbase
  - tzdata
  - ca-certificates
  - locales